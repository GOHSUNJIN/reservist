<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audit Log</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f7f9fc;color:#161f30;min-height:100vh;}
a{color:inherit;text-decoration:none;}
button{cursor:pointer;font-family:inherit;}
input{font-family:inherit;}

/* Login */
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;}
.login-card{background:#fff;border-radius:14px;box-shadow:0 2px 8px rgba(20,30,50,.08);padding:36px 32px;width:100%;max-width:360px;}
.login-logo{width:42px;height:42px;border-radius:9px;background:#2f5fd0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;color:#fff;margin-bottom:20px;}
.login-title{font-size:22px;font-weight:700;color:#161f30;margin-bottom:4px;}
.login-sub{font-size:13px;color:#8a94a3;margin-bottom:28px;}
.form-group{margin-bottom:16px;}
.form-label{font-size:12px;font-weight:600;color:#8a94a3;text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:6px;}
.form-input{width:100%;border:1px solid #f0f2f7;border-radius:9px;padding:10px 12px;font-size:14px;color:#161f30;outline:none;transition:border-color .15s;}
.form-input:focus{border-color:#2f5fd0;}
.btn-primary{width:100%;background:#2f5fd0;color:#fff;border:none;border-radius:9px;padding:11px;font-size:14px;font-weight:600;transition:opacity .15s;}
.btn-primary:hover{opacity:.88;}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;}
.login-error{background:#f7e4e1;color:#c0392b;border-radius:8px;padding:10px 12px;font-size:13px;margin-top:14px;display:none;}

/* App shell */
#app-screen{display:none;min-height:100vh;flex-direction:column;}
header{background:#fff;border-bottom:1px solid #f0f2f7;padding:0 20px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;}
.header-left{display:flex;align-items:center;gap:12px;}
.header-logo{width:32px;height:32px;border-radius:7px;background:#2f5fd0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;flex-shrink:0;}
.header-title{font-size:15px;font-weight:700;color:#161f30;}
.dept-badge{font-size:11px;font-weight:600;background:#e8f0fd;color:#2f5fd0;border-radius:20px;padding:3px 9px;}
.btn-logout{background:none;border:1px solid #f0f2f7;border-radius:8px;padding:6px 12px;font-size:13px;color:#8a94a3;transition:all .15s;}
.btn-logout:hover{border-color:#c0392b;color:#c0392b;}

main{flex:1;padding:20px;max-width:1100px;margin:0 auto;width:100%;}

/* Stat cards */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;}
@media(max-width:640px){.stats-row{grid-template-columns:repeat(2,1fr);}}
.stat-card{background:#fff;border-radius:14px;box-shadow:0 2px 8px rgba(20,30,50,.08);padding:16px 18px;border:1px solid #f0f2f7;}
.stat-value{font-size:26px;font-weight:700;color:#161f30;line-height:1.1;}
.stat-label{font-size:12px;color:#8a94a3;margin-top:4px;}

/* Filters */
.filter-card{background:#fff;border-radius:14px;box-shadow:0 2px 8px rgba(20,30,50,.08);padding:14px 16px;margin-bottom:16px;border:1px solid #f0f2f7;}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
.pill{border:1px solid #f0f2f7;background:#f7f9fc;border-radius:20px;padding:5px 12px;font-size:12px;font-weight:500;color:#8a94a3;cursor:pointer;transition:all .15s;}
.pill.active{background:#2f5fd0;color:#fff;border-color:#2f5fd0;}
.pill:hover:not(.active){border-color:#2f5fd0;color:#2f5fd0;}
.filter-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.filter-input{border:1px solid #f0f2f7;border-radius:8px;padding:8px 10px;font-size:13px;color:#161f30;outline:none;transition:border-color .15s;background:#fff;}
.filter-input:focus{border-color:#2f5fd0;}
.filter-search{flex:1;min-width:140px;}
.filter-date{width:140px;}
.dept-select{border:1px solid #f0f2f7;border-radius:8px;padding:8px 10px;font-size:13px;color:#161f30;outline:none;background:#fff;cursor:pointer;}

/* Events list */
.events-card{background:#fff;border-radius:14px;box-shadow:0 2px 8px rgba(20,30,50,.08);border:1px solid #f0f2f7;overflow:hidden;}
.events-header{padding:14px 16px;border-bottom:1px solid #f0f2f7;font-size:13px;font-weight:600;color:#8a94a3;display:flex;justify-content:space-between;align-items:center;}
.event-row{padding:12px 16px;border-bottom:1px solid #f0f2f7;display:flex;align-items:flex-start;gap:12px;cursor:pointer;transition:background .12s;}
.event-row:last-child{border-bottom:none;}
.event-row:hover{background:#f7f9fc;}
.cat-badge{border-radius:20px;padding:3px 9px;font-size:11px;font-weight:600;white-space:nowrap;flex-shrink:0;align-self:flex-start;margin-top:1px;}
.actor-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0;}
.event-body{flex:1;min-width:0;}
.event-actor{font-size:13px;font-weight:600;color:#161f30;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.role-badge{font-size:10px;font-weight:600;border-radius:4px;padding:1px 5px;}
.event-action{font-size:12px;color:#8a94a3;margin-top:2px;}
.event-target{font-size:12px;color:#2f5fd0;margin-top:1px;}
.event-dept{font-size:11px;color:#b0bec5;margin-top:1px;}
.event-time-col{text-align:right;flex-shrink:0;}
.event-rel-time{font-size:12px;color:#8a94a3;white-space:nowrap;}
.event-meta{background:#f7f9fc;border-radius:8px;padding:10px 12px;margin-top:8px;font-size:12px;font-family:monospace;white-space:pre-wrap;word-break:break-all;color:#4a5568;display:none;}
.event-row.expanded .event-meta{display:block;}
.load-more-wrap{padding:14px;text-align:center;}
.btn-load-more{background:#f7f9fc;border:1px solid #f0f2f7;border-radius:9px;padding:9px 20px;font-size:13px;font-weight:600;color:#2f5fd0;transition:all .15s;}
.btn-load-more:hover{background:#e8f0fd;}

/* Empty / loading */
.empty-state{padding:48px 20px;text-align:center;color:#8a94a3;}
.empty-icon{width:48px;height:48px;margin:0 auto 14px;opacity:.35;}
.empty-title{font-size:15px;font-weight:600;margin-bottom:6px;}
.empty-sub{font-size:13px;}
.spinner{width:32px;height:32px;border:3px solid #f0f2f7;border-top-color:#2f5fd0;border-radius:50%;animation:spin .7s linear infinite;margin:40px auto;}
@keyframes spin{to{transform:rotate(360deg);}}

/* Access denied */
#access-denied{display:none;padding:40px 20px;text-align:center;max-width:400px;margin:80px auto;}
.denied-icon{font-size:40px;margin-bottom:16px;}
.denied-title{font-size:20px;font-weight:700;margin-bottom:8px;}
.denied-sub{font-size:14px;color:#8a94a3;margin-bottom:24px;}
</style>
</head>
<body>

<!-- Login screen -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">GO</div>
    <div class="login-title">Audit Log</div>
    <div class="login-sub">Admin access only</div>
    <div class="form-group">
      <label class="form-label">Contact Number</label>
      <input id="login-contact" class="form-input" type="tel" placeholder="e.g. 91234567" autocomplete="off">
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <input id="login-password" class="form-input" type="password" placeholder="Password">
    </div>
    <button id="login-btn" class="btn-primary">Log In</button>
    <div id="login-error" class="login-error"></div>
  </div>
</div>

<!-- Access denied screen -->
<div id="access-denied">
  <div class="denied-icon">&#128274;</div>
  <div class="denied-title">Access Denied</div>
  <div class="denied-sub">This page is restricted to admins and superadmins. Contact your system administrator if you believe this is an error.</div>
  <button class="btn-primary" style="width:auto;padding:10px 24px;" onclick="doLogout()">Back to Login</button>
</div>

<!-- Main app -->
<div id="app-screen" style="display:none;flex-direction:column;">
  <header>
    <div class="header-left">
      <div class="header-logo">GO</div>
      <div class="header-title">Audit Log</div>
      <div class="dept-badge" id="dept-badge"></div>
    </div>
    <button class="btn-logout" onclick="doLogout()">Log out</button>
  </header>
  <main>
    <!-- Stats row -->
    <div class="stats-row" id="stats-row">
      <div class="stat-card"><div class="stat-value" id="stat-today">-</div><div class="stat-label">Events Today</div></div>
      <div class="stat-card"><div class="stat-value" id="stat-actors">-</div><div class="stat-label">Unique Actors</div></div>
      <div class="stat-card"><div class="stat-value" id="stat-week">-</div><div class="stat-label">This Week</div></div>
      <div class="stat-card"><div class="stat-value" id="stat-top-cat">-</div><div class="stat-label">Top Category</div></div>
    </div>

    <!-- Filters -->
    <div class="filter-card">
      <!-- Dept selector (superadmin only) -->
      <div id="dept-filter-wrap" style="margin-bottom:12px;display:none;">
        <label class="form-label" style="margin-bottom:6px;">Department</label>
        <select id="dept-select" class="dept-select" onchange="onDeptChange()">
          <option value="">All Departments</option>
          <option value="ops_security">Ops Security</option>
          <option value="cas">CAS</option>
          <option value="lnf">LnF</option>
        </select>
      </div>
      <!-- Category pills -->
      <div class="pills" id="cat-pills">
        <button class="pill active" data-cat="all" onclick="setCat(this)">All</button>
        <button class="pill" data-cat="auth" onclick="setCat(this)">Auth</button>
        <button class="pill" data-cat="attendance" onclick="setCat(this)">Attendance</button>
        <button class="pill" data-cat="leave" onclick="setCat(this)">Leave</button>
        <button class="pill" data-cat="signup" onclick="setCat(this)">Signup</button>
        <button class="pill" data-cat="personnel" onclick="setCat(this)">Personnel</button>
        <button class="pill" data-cat="batch" onclick="setCat(this)">Cycle</button>
        <button class="pill" data-cat="export" onclick="setCat(this)">Export</button>
        <button class="pill" data-cat="account" onclick="setCat(this)">Account</button>
        <button class="pill" data-cat="admin" onclick="setCat(this)">Admin Mgmt</button>
      </div>
      <!-- Date + search row -->
      <div class="filter-row">
        <input class="filter-input filter-date" type="date" id="date-from" placeholder="From" title="From date" onchange="applyFilters()">
        <input class="filter-input filter-date" type="date" id="date-to" placeholder="To" title="To date" onchange="applyFilters()">
        <input class="filter-input filter-search" type="search" id="search-input" placeholder="Search actor, action, target..." oninput="onSearchInput()">
      </div>
    </div>

    <!-- Events list -->
    <div class="events-card" id="events-card">
      <div class="events-header">
        <span id="events-count-label">Events</span>
      </div>
      <div id="events-list"></div>
      <div class="load-more-wrap" id="load-more-wrap" style="display:none;">
        <button class="btn-load-more" onclick="loadMore()">Load more</button>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../js/config.js"></script>
<script>
// ── Supabase client ───────────────────────────────────────────────────────
const _db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ── State ─────────────────────────────────────────────────────────────────
let _session = null;
let _myRecord = null;
let _isSuperAdmin = false;
let _filterDept = null;
let _filterCat = 'all';
let _filterSearch = '';
let _filterFrom = '';
let _filterTo = '';
let _offset = 0;
let _totalCount = 0;
let _events = [];
let _searchTimer = null;
const LIMIT = 100;

// ── Color/label maps ──────────────────────────────────────────────────────
const CAT_COLORS = {
  auth:       { bg: '#e8f0fd', color: '#2f5fd0', label: 'Auth' },
  attendance: { bg: '#e7f3ec', color: '#1f8a5b', label: 'Attendance' },
  leave:      { bg: '#fdf6e9', color: '#b9791a', label: 'Leave' },
  signup:     { bg: '#f0ecfd', color: '#6b52c8', label: 'Signup' },
  personnel:  { bg: '#e6f7f9', color: '#0e7a8c', label: 'Personnel' },
  batch:      { bg: '#edf2f7', color: '#4a5568', label: 'Cycle' },
  export:     { bg: '#f0f2f7', color: '#2d3748', label: 'Export' },
  account:    { bg: '#fdf0e9', color: '#e07b39', label: 'Account' },
  admin:      { bg: '#f7e4e1', color: '#c0392b', label: 'Admin Mgmt' },
};

const ACTION_LABELS = {
  'auth.login': 'Logged in',
  'auth.logout': 'Logged out',
  'auth.session_extended': 'Extended session',
  'checkin.p1': 'Checked in (Phase 1)',
  'checkin.p2': 'Lunch out (Phase 2)',
  'checkin.p3': 'Returned from lunch (Phase 3)',
  'checkin.p4': 'Checked out (Phase 4)',
  'checkin.late_reason': 'Submitted late reason',
  'roster.status_set': 'Set attendance status',
  'roster.mark_all_absent': 'Marked all absent',
  'roster.mark_all_present': 'Marked all present',
  'roster.times_corrected': 'Corrected attendance times',
  'roster.person_note_saved': 'Saved person note',
  'roster.log_note_saved': 'Saved log note',
  'roster.welfare_note_saved': 'Saved welfare note',
  'leave.submitted': 'Submitted leave request',
  'leave.cancelled': 'Withdrew leave request',
  'leave.approved': 'Approved leave request',
  'leave.rejected': 'Declined leave request',
  'leave.bulk_approved': 'Bulk approved leave requests',
  'leave.bulk_rejected': 'Bulk declined leave requests',
  'signup.approved': 'Approved signup',
  'signup.rejected': 'Declined signup',
  'signup.reopened': 'Re-opened signup',
  'signup.bulk_approved': 'Bulk approved signups',
  'personnel.added': 'Added to roster',
  'personnel.re_enrolled': 'Re-enrolled personnel',
  'personnel.removed': 'Removed from roster',
  'personnel.bulk_added': 'Bulk added personnel',
  'personnel.password_reset': 'Reset password',
  'personnel.permanently_deleted': 'Permanently deleted record',
  'batch.activated': 'Activated cycle',
  'batch.label_edited': 'Edited cycle label',
  'batch.broadcast_updated': 'Updated cycle notice',
  'batch.no_report_toggled': 'Toggled no-report day',
  'batch.meal_toggled': 'Toggled meal allowance',
  'admin.added': 'Added supervisor',
  'admin.demoted': 'Demoted supervisor',
  'admin.promoted': 'Promoted to supervisor',
  'export.excel': 'Exported Excel report',
  'export.print': 'Generated print report',
  'export.person_history': 'Exported person history',
  'account.name_changed': 'Changed display name',
  'account.password_changed': 'Changed password',
  'account.photo_uploaded': 'Uploaded profile photo',
  'account.photo_removed': 'Removed profile photo',
};

const DEPT_LABELS = {
  ops_security: 'Ops Security',
  cas: 'CAS',
  lnf: 'LnF',
};

// ── Utilities ─────────────────────────────────────────────────────────────
function contactToEmail(contact) {
  return contact.replace(/[\s-]/g, '') + '@opsreservist.mil';
}

function initials(name) {
  if (!name) return '?';
  const parts = name.trim().split(/\s+/);
  if (parts.length >= 2) return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
  return name.slice(0, 2).toUpperCase();
}

function avatarColor(role) {
  if (role === 'superadmin') return '#c0392b';
  if (role === 'admin') return '#2f5fd0';
  return '#8a94a3';
}

function relTime(iso) {
  const now = Date.now(), then = new Date(iso).getTime(), diff = Math.floor((now - then) / 1000);
  if (diff < 60) return diff + 's ago';
  if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
  if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
  if (diff < 172800) return 'Yesterday';
  return Math.floor(diff / 86400) + 'd ago';
}

function fmtAbsTime(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function esc(s) {
  return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function showError(msg) {
  const el = document.getElementById('login-error');
  el.textContent = msg;
  el.style.display = 'block';
}

function hideError() {
  document.getElementById('login-error').style.display = 'none';
}

// ── Login ─────────────────────────────────────────────────────────────────
document.getElementById('login-contact').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
document.getElementById('login-password').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
document.getElementById('login-btn').addEventListener('click', doLogin);

async function doLogin() {
  hideError();
  const contact = document.getElementById('login-contact').value.trim();
  const password = document.getElementById('login-password').value;
  if (!contact) { showError('Enter your contact number.'); return; }
  if (!password) { showError('Enter your password.'); return; }
  const btn = document.getElementById('login-btn');
  btn.disabled = true;
  btn.textContent = 'Logging in...';

  const email = contactToEmail(contact);
  const { data, error } = await _db.auth.signInWithPassword({ email, password });
  if (error || !data?.user) {
    btn.disabled = false; btn.textContent = 'Log In';
    showError('Invalid contact number or password.');
    return;
  }
  _session = data.session;

  // Check role in personnel table
  const { data: personnel, error: pErr } = await _db.from('personnel')
    .select('id, name, role, department, is_active')
    .eq('auth_id', data.user.id)
    .single();

  if (pErr || !personnel) {
    await _db.auth.signOut({ scope: 'local' });
    btn.disabled = false; btn.textContent = 'Log In';
    showError('Account not found in personnel records.');
    return;
  }

  if (personnel.role !== 'admin' && personnel.role !== 'superadmin') {
    await _db.auth.signOut({ scope: 'local' });
    btn.disabled = false; btn.textContent = 'Log In';
    showError('Access denied. Admin or superadmin role required.');
    return;
  }

  _myRecord = personnel;
  _isSuperAdmin = personnel.role === 'superadmin';
  _filterDept = _isSuperAdmin ? null : (personnel.department || null);

  document.getElementById('login-screen').style.display = 'none';
  showApp();
}

function showApp() {
  const app = document.getElementById('app-screen');
  app.style.display = 'flex';

  // Dept badge
  const badge = document.getElementById('dept-badge');
  if (_isSuperAdmin) {
    badge.textContent = 'Superadmin';
    badge.style.background = '#f7e4e1';
    badge.style.color = '#c0392b';
  } else {
    badge.textContent = DEPT_LABELS[_myRecord.department] || _myRecord.department || 'Admin';
  }

  // Show dept filter for superadmin
  if (_isSuperAdmin) {
    document.getElementById('dept-filter-wrap').style.display = 'block';
  }

  loadStats();
  loadEvents(true);
}

async function doLogout() {
  await _db.auth.signOut({ scope: 'local' }).catch(() => {});
  _session = null; _myRecord = null; _isSuperAdmin = false;
  _filterDept = null; _filterCat = 'all'; _filterSearch = ''; _filterFrom = ''; _filterTo = '';
  _offset = 0; _events = [];
  document.getElementById('app-screen').style.display = 'none';
  document.getElementById('access-denied').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('login-contact').value = '';
  document.getElementById('login-password').value = '';
  const btn = document.getElementById('login-btn');
  btn.disabled = false; btn.textContent = 'Log In';
}

// ── Stats ─────────────────────────────────────────────────────────────────
async function loadStats() {
  const dept = _isSuperAdmin ? (_filterDept || null) : (_myRecord.department || null);

  // Today stats
  const today = new Date(); today.setHours(0, 0, 0, 0);
  let q1 = _db.from('audit_log').select('category, actor_id, created_at');
  if (dept) q1 = q1.eq('department', dept);
  q1 = q1.gte('created_at', today.toISOString());
  const { data: todayData } = await q1;
  const todayRows = todayData || [];

  document.getElementById('stat-today').textContent = todayRows.length;
  const uniqueActors = new Set(todayRows.map(r => r.actor_id).filter(Boolean));
  document.getElementById('stat-actors').textContent = uniqueActors.size;

  // Category frequency
  const catCount = {};
  for (const r of todayRows) { catCount[r.category] = (catCount[r.category] || 0) + 1; }
  let topCat = '-';
  let topCount = 0;
  for (const [k, v] of Object.entries(catCount)) { if (v > topCount) { topCount = v; topCat = k; } }
  const topCatInfo = CAT_COLORS[topCat];
  document.getElementById('stat-top-cat').textContent = topCatInfo ? topCatInfo.label : topCat;

  // Week stats
  const weekStart = new Date(); weekStart.setDate(weekStart.getDate() - 6); weekStart.setHours(0, 0, 0, 0);
  let q2 = _db.from('audit_log').select('id', { count: 'exact', head: true });
  if (dept) q2 = q2.eq('department', dept);
  q2 = q2.gte('created_at', weekStart.toISOString());
  const { count: weekCount } = await q2;
  document.getElementById('stat-week').textContent = weekCount || 0;
}

// ── Filters ───────────────────────────────────────────────────────────────
function setCat(el) {
  document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  _filterCat = el.dataset.cat;
  _offset = 0;
  loadEvents(true);
}

function onDeptChange() {
  _filterDept = document.getElementById('dept-select').value || null;
  _offset = 0;
  loadStats();
  loadEvents(true);
}

function applyFilters() {
  _filterFrom = document.getElementById('date-from').value;
  _filterTo = document.getElementById('date-to').value;
  _offset = 0;
  loadEvents(true);
}

function onSearchInput() {
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(() => {
    _filterSearch = document.getElementById('search-input').value.trim();
    _offset = 0;
    loadEvents(true);
  }, 350);
}

// ── Events ────────────────────────────────────────────────────────────────
async function loadEvents(reset) {
  if (reset) { _offset = 0; _events = []; }
  const list = document.getElementById('events-list');
  if (reset) list.innerHTML = '<div class="spinner"></div>';

  const dept = _isSuperAdmin ? (_filterDept || null) : (_myRecord.department || null);

  let q = _db.from('audit_log').select('*', { count: 'exact' });
  if (dept) q = q.eq('department', dept);
  if (_filterCat && _filterCat !== 'all') q = q.eq('category', _filterCat);
  if (_filterFrom) q = q.gte('created_at', _filterFrom + 'T00:00:00');
  if (_filterTo) q = q.lte('created_at', _filterTo + 'T23:59:59');
  if (_filterSearch) {
    const s = _filterSearch.replace(/'/g, "''");
    q = q.or(`actor_name.ilike.%${s}%,action.ilike.%${s}%,target_name.ilike.%${s}%`);
  }
  q = q.order('created_at', { ascending: false }).range(_offset, _offset + LIMIT - 1);

  const { data, count, error } = await q;
  if (error) {
    list.innerHTML = '<div class="empty-state"><div class="empty-title">Failed to load events</div><div class="empty-sub">' + esc(error.message) + '</div></div>';
    return;
  }

  _totalCount = count || 0;
  const rows = data || [];
  if (reset) _events = rows;
  else _events = _events.concat(rows);
  _offset += rows.length;

  renderEvents(reset, rows);
  updateCountLabel();
}

function renderEvents(reset, newRows) {
  const list = document.getElementById('events-list');
  if (reset) list.innerHTML = '';

  if (_events.length === 0) {
    list.innerHTML = '<div class="empty-state"><svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg><div class="empty-title">No events found</div><div class="empty-sub">Try adjusting your filters or date range.</div></div>';
    document.getElementById('load-more-wrap').style.display = 'none';
    return;
  }

  const rowsToRender = reset ? _events : newRows;
  for (const ev of rowsToRender) {
    list.appendChild(buildEventRow(ev));
  }

  const wrap = document.getElementById('load-more-wrap');
  wrap.style.display = _offset < _totalCount ? 'block' : 'none';
}

function buildEventRow(ev) {
  const cat = CAT_COLORS[ev.category] || { bg: '#f0f2f7', color: '#4a5568', label: ev.category };
  const actionLabel = ACTION_LABELS[ev.action] || ev.action;
  const roleColor = ev.actor_role === 'superadmin' ? '#c0392b' : ev.actor_role === 'admin' ? '#2f5fd0' : '#8a94a3';
  const roleLabel = ev.actor_role === 'superadmin' ? 'Superadmin' : ev.actor_role === 'admin' ? 'Admin' : 'Reservist';
  const roleBg = ev.actor_role === 'superadmin' ? '#f7e4e1' : ev.actor_role === 'admin' ? '#e8f0fd' : '#f0f2f7';
  const hasMeta = ev.meta && Object.keys(ev.meta).length > 0;
  const deptLabel = DEPT_LABELS[ev.department] || ev.department || '';

  const div = document.createElement('div');
  div.className = 'event-row';
  div.innerHTML = `
    <span class="cat-badge" style="background:${esc(cat.bg)};color:${esc(cat.color)}">${esc(cat.label)}</span>
    <div class="actor-avatar" style="background:${esc(avatarColor(ev.actor_role))}" title="${esc(ev.actor_name || '')}">${esc(initials(ev.actor_name))}</div>
    <div class="event-body">
      <div class="event-actor">
        ${esc(ev.actor_name || 'Unknown')}
        <span class="role-badge" style="background:${esc(roleBg)};color:${esc(roleColor)}">${esc(roleLabel)}</span>
      </div>
      <div class="event-action">${esc(actionLabel)}</div>
      ${ev.target_name ? `<div class="event-target">Re: ${esc(ev.target_name)}</div>` : ''}
      ${deptLabel ? `<div class="event-dept">${esc(deptLabel)}</div>` : ''}
      ${hasMeta ? `<div class="event-meta">${esc(JSON.stringify(ev.meta, null, 2))}</div>` : ''}
    </div>
    <div class="event-time-col">
      <div class="event-rel-time" title="${esc(fmtAbsTime(ev.created_at))}">${esc(relTime(ev.created_at))}</div>
    </div>
  `;

  if (hasMeta) {
    div.addEventListener('click', () => div.classList.toggle('expanded'));
  }

  return div;
}

function updateCountLabel() {
  const label = document.getElementById('events-count-label');
  label.textContent = _totalCount + ' event' + (_totalCount !== 1 ? 's' : '');
}

function loadMore() {
  loadEvents(false);
}

// ── Init: check for existing session ─────────────────────────────────────
(async () => {
  const { data } = await _db.auth.getSession();
  if (data?.session?.user) {
    const { data: personnel } = await _db.from('personnel')
      .select('id, name, role, department, is_active')
      .eq('auth_id', data.session.user.id)
      .single();
    if (personnel && (personnel.role === 'admin' || personnel.role === 'superadmin')) {
      _session = data.session;
      _myRecord = personnel;
      _isSuperAdmin = personnel.role === 'superadmin';
      _filterDept = _isSuperAdmin ? null : (personnel.department || null);
      document.getElementById('login-screen').style.display = 'none';
      showApp();
    }
  }
})();
</script>
